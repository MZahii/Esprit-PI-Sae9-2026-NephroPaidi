# Analyse SonarQube du frontend Angular (couverture Vitest -> LCOV)
sonar.projectKey=nephropaidi-frontend
sonar.projectName=NephroPaidi Frontend
sonar.sources=src
sonar.tests=src
sonar.exclusions=**/node_modules/**,src/assets/**,public/**,**/*.spec.ts,src/app/testing/**
sonar.test.inclusions=**/*.spec.ts,src/app/testing/**
sonar.coverage.exclusions=**/*.models.ts,src/app/core/models/**,src/environments/**,src/main.ts
sonar.javascript.lcov.reportPaths=coverage/nephropaidi-frontend/lcov.info
sonar.sourceEncoding=UTF-8
