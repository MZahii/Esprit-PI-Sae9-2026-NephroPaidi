<div class="page-header">
  <div class="page-header-left d-flex align-items-center">
    <div class="page-header-title">
      <h5 class="m-b-10">Dialysis Prescriptions</h5>
    </div>
    <ul class="breadcrumb">
      <li class="breadcrumb-item">
        <a routerLink="/backoffice/dashboard">Home</a>
      </li>
      <li class="breadcrumb-item">Procedure Service</li>
      <li class="breadcrumb-item">Dialysis Prescriptions</li>
    </ul>
  </div>
</div>

<div class="main-content">
  <div class="row g-4">
    <div class="col-12 col-xl-4">
      <div class="card stretch stretch-full">
        <div class="card-header">
          <h5 class="card-title">Create Prescription</h5>
        </div>
        <div class="card-body">
          <div class="mb-3">
            <label class="form-label">Dialysis Plan</label>
            <select class="form-select" [(ngModel)]="selectedPlanId">
              <option *ngFor="let plan of plans" [value]="plan.id">
                {{ plan.firstName || '-' }} {{ plan.lastName || '' }}
              </option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Details</label>
            <textarea class="form-control" rows="4" [(ngModel)]="createDetails"></textarea>
          </div>
          <button type="button" class="btn btn-primary w-100" (click)="createPrescription()" [disabled]="saving">
            {{ saving ? 'Saving...' : 'Create Prescription' }}
          </button>
        </div>
      </div>
    </div>

    <div class="col-12 col-xl-8">
      <div class="card stretch stretch-full">
        <div class="card-header d-flex justify-content-between align-items-center">
          <h5 class="card-title mb-0">Prescriptions List</h5>
          <button type="button" class="btn btn-light btn-sm" (click)="loadInitialData()">
            Refresh
          </button>
        </div>
        <div class="card-body">
          <div *ngIf="errorMessage" class="alert alert-danger mb-3">{{ errorMessage }}</div>
          <div *ngIf="successMessage" class="alert alert-success mb-3">{{ successMessage }}</div>
          <div *ngIf="loading" class="empty-state">Loading prescriptions...</div>

          <div class="mb-3" *ngIf="!loading">
            <input
              type="text"
              class="form-control"
              [(ngModel)]="searchTerm"
              placeholder="Filter by patient name"
            />
          </div>

          <div class="table-responsive" *ngIf="!loading">
            <table class="table table-hover align-middle mb-0">
              <thead>
                <tr>
                  <th>Plan</th>
                  <th>Details</th>
                  <th class="text-end">Action</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngIf="filteredPrescriptions.length === 0">
                  <td colspan="3" class="empty-state">No prescriptions found yet.</td>
                </tr>
                <tr *ngFor="let prescription of filteredPrescriptions">
                  <td>{{ getPlanDisplay(prescription.planId) }}</td>
                  <td>
                    <textarea
                      class="form-control form-control-sm"
                      rows="2"
                      [(ngModel)]="editDetails[prescription.id]"
                    ></textarea>
                  </td>
                  <td class="text-end">
                    <button type="button" class="btn btn-outline-primary btn-sm" (click)="updatePrescription(prescription)">
                      Save
                    </button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
