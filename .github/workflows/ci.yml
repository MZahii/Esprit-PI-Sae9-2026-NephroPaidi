name: CI
on: [push, pull_request]
jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build backend services with Maven
        run: |
          set -e
          find BackEnd -name pom.xml -print0 | while IFS= read -r -d '' pom; do
            echo "Building $pom"
            mvn -q -DskipTests -f "$pom" verify
          done

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Node setup
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Frontend build
        working-directory: FrontEnd
        run: |
          npm ci
          npx ng build --configuration=production --no-progress
