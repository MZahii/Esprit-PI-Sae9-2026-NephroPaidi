name: nephropaidi-devops

services:
  jenkins:
    build:
      context: .
      dockerfile: devops/jenkins/Dockerfile
    image: nephropaidi-jenkins-docker:lts
    container_name: nephro-jenkins
    user: root
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "${JENKINS_HTTP_PORT:-8099}:8080"
      - "${JENKINS_AGENT_PORT:-50000}:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - devops-net

  sonarqube-db:
    image: postgres:15-alpine
    container_name: nephro-sonarqube-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SONAR_DB_USER:-sonar}
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:-sonar}
      POSTGRES_DB: ${SONAR_DB_NAME:-sonarqube}
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data
    networks:
      - devops-net

  sonarqube:
    image: sonarqube:lts-community
    container_name: nephro-sonarqube
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    depends_on:
      - sonarqube-db
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/${SONAR_DB_NAME:-sonarqube}
      SONAR_JDBC_USERNAME: ${SONAR_DB_USER:-sonar}
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:-sonar}
      # JVM memory optimization for faster analysis processing
      SONAR_WEB_JAVAADDITIONALOPTS: -Xmx2G
      SONAR_CE_JAVAADDITIONALOPTS: -Xmx2G
      # Increase number of workers for parallel task processing
      SONAR_CE_WORKERS: 4
    ports:
      - "${SONARQUBE_PORT:-9000}:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - devops-net

networks:
  devops-net:
    name: nephro-devops-net

volumes:
  jenkins_home:
  sonarqube_db_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
