server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: api-gateway
  config:
    import: ${SPRING_CONFIG_IMPORT:optional:configserver:http://localhost:8888}
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
              lower-case-service-id: true
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOriginPatterns:
                  - "http://localhost:*"
                  - "http://127.0.0.1:*"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true
          routes:
            - id: user-service-api-fallback
              uri: ${USER_SERVICE_URI:http://localhost:8090}
              order: -100
              predicates:
                - Path=/api/users/**,/api/auth/**

            - id: administration-service-api-fallback
              uri: ${ADMINISTRATION_SERVICE_URI:http://localhost:8087}
              order: -100
              predicates:
                - Path=/api/patients/**,/api/contracts/**,/api/observability/**

            - id: administration-service-structure-api-fallback
              uri: ${ADMINISTRATION_SERVICE_URI:http://localhost:8087}
              order: -100
              predicates:
                - Path=/api/hospital-structure/**,/api/hospital-resources/**,/api/staff-assignments/**
              filters:
                - RewritePath=/api/?(.*), /$1

            - id: clinical-service-api-fallback
              uri: ${CLINICAL_SERVICE_URI:http://localhost:8084}
              order: -100
              predicates:
                - Path=/api/clinical/**
              filters:
                - RewritePath=/api/clinical/?(?<segment>.*), /clinical/$\{segment}

            - id: communication-service-api-fallback
              uri: ${COMMUNICATION_SERVICE_URI:http://localhost:8085}
              order: -100
              predicates:
                - Path=/api/communication/**,/api/appointments/**

            - id: procedure-service-api-fallback
              uri: ${PROCEDURE_SERVICE_URI:http://localhost:8089}
              order: -100
              predicates:
                - Path=/api/procedures/**

            - id: pharmacy-service-api-fallback
              uri: ${PHARMACY_SERVICE_URI:http://localhost:8088}
              order: -100
              predicates:
                - Path=/api/pharmacy/**
              filters:
                - RewritePath=/api/pharmacy/?(.*), /api/$1

            - id: ops-service-api-fallback
              uri: ${OPS_SERVICE_URI:http://localhost:8082}
              order: -100
              predicates:
                - Path=/api/ops/**
              filters:
                - RewritePath=/api/ops/?(.*), /api/$1
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/nephrospaidi}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/nephrospaidi}/protocol/openid-connect/certs}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}

management:
  endpoint:
    gateway:
      access: read-only
  endpoints:
    web:
      exposure:
        include: health,info,gateway
