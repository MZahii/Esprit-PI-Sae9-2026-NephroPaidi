spring:
  application:
    name: clinical-service
  config:
    import: optional:configserver:http://config-server:8888
  flyway:
    outOfOrder: true
    validateOnMigrate: false
    repairOnMigrate: true
  datasource:
    hikari:
      connection-timeout: 10000
      validation-timeout: 5000
      initialization-fail-timeout: 10000
      maximum-pool-size: 5
      minimum-idle: 1
      keepalive-time: 30000
      max-lifetime: 600000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://eureka:8761/eureka}
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:clinical-service}

# Feign Configuration
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 10000
        loggerLevel: full
      
      user-service:
        connectTimeout: 3000
        readTimeout: 8000
      
      administration-service:
        connectTimeout: 3000
        readTimeout: 8000
      
      pharmacy-service:
        connectTimeout: 3000
        readTimeout: 8000
      
      communication-service:
        connectTimeout: 3000
        readTimeout: 8000

# Resilience4j Circuit Breaker
resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 2000
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10000
    
    instances:
      user-service:
        baseConfig: default
      administration-service:
        baseConfig: default
      pharmacy-service:
        baseConfig: default
      communication-service:
        baseConfig: default
  
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 100
        intervalFunction: exponential
    
    instances:
      user-service:
        baseConfig: default
      administration-service:
        baseConfig: default
      pharmacy-service:
        baseConfig: default

# Service URLs for Feign clients
services:
  user:
    url: ${USER_SERVICE_URL:${SERVICES_USER_BASE_URL:${SERVICES_USER_BASE:http://localhost:8090}}}
    base-url: ${SERVICES_USER_BASE_URL:${SERVICES_USER_BASE:http://localhost:8090}}
  admin:
    url: ${ADMIN_SERVICE_URL:${SERVICES_ADMINISTRATION_BASE_URL:${SERVICES_ADMINISTRATION_BASE:http://localhost:8087}}}
  administration:
    base-url: ${SERVICES_ADMINISTRATION_BASE_URL:${SERVICES_ADMINISTRATION_BASE:http://localhost:8087}}
  pharmacy:
    url: ${PHARMACY_SERVICE_URL:${SERVICES_PHARMACY_URL:http://localhost:8088}}
  communication:
    url: ${COMMUNICATION_SERVICE_URL:${SERVICES_COMMUNICATION_URL:http://localhost:8085}}
  ai-clinical:
    base-url: ${AI_CLINICAL_SERVICE_URL:http://ai-clinical-service:8091}

# Management/Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true

server:
  port: 8084
  address: 0.0.0.0
