spring:
  cloud:
    config:
      uri: ${SPRING_CLOUD_CONFIG_URI:http://localhost:8888}
      name: ${spring.application.name}
      fail-fast: true
      retry:
        initial-interval: 1000
        max-interval: 10000
        multiplier: 1.1
        max-attempts: 5
  application:
    name: procedure-service
  profiles:
    active: ${ENVIRONMENT:dev}
