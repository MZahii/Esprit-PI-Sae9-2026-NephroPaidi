spring:
  datasource:
    url: jdbc:h2:mem:pharmacy_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false
  flyway:
    enabled: false
  mail:
    host: localhost
    port: 3025
    username: test@test.com
    password: test
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost/realms/test

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

internal:
  api-key: test-key
