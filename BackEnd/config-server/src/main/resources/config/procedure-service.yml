server:
  port: 8089

spring:
  datasource:
    url: ${PROCEDURE_DB_URL:jdbc:postgresql://ep-cool-breeze-agqhhjlc.c-2.eu-central-1.aws.neon.tech/procedure_db?sslmode=require&channel_binding=require}
    username: ${PROCEDURE_DB_USERNAME:neondb_owner}
    password: ${PROCEDURE_DB_PASSWORD:npg_Zb1Kda5LPlin}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/nephrospaidi}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/nephrospaidi/protocol/openid-connect/certs}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}

twilio:
  whatsapp:
    enabled: ${TWILIO_WHATSAPP_ENABLED:false}
    account-sid: ${TWILIO_WHATSAPP_ACCOUNT_SID:}
    auth-token: ${TWILIO_WHATSAPP_AUTH_TOKEN:}
    from: ${TWILIO_WHATSAPP_FROM:whatsapp:+14155238886}
    default-recipient: ${TWILIO_WHATSAPP_DEFAULT_RECIPIENT:}
    api-base-url: ${TWILIO_WHATSAPP_API_BASE_URL:https://api.twilio.com}
