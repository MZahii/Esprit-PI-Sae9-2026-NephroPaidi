server:
  port: 8085

spring:
  datasource:
    url: ${COMM_DB_URL:jdbc:postgresql://ep-cool-breeze-agqhhjlc.c-2.eu-central-1.aws.neon.tech/nephros_communication_service_db?sslmode=require&channel_binding=require}
    username: ${COMM_DB_USER:neondb_owner}
    password: ${COMM_DB_PASSWORD:npg_Zb1Kda5LPlin}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/nephrospaidi}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/nephrospaidi/protocol/openid-connect/certs}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}

internal:
  api-key: ${INTERNAL_API_KEY:my-super-secret-internal-key}
  user-service:
    base-url: ${USER_SERVICE_BASE_URL:http://localhost:8090}
  administration-service:
    base-url: ${ADMINISTRATION_SERVICE_BASE_URL:http://localhost:8087}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

ai:
  triage:
    enabled: ${AI_TRIAGE_ENABLED:true}
    base-url: ${AI_TRIAGE_SERVICE_BASE_URL:http://localhost:8086/api/ai/message-urgency-triage}
    timeout-millis: ${AI_TRIAGE_TIMEOUT_MILLIS:1500}
