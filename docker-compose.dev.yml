name: nephropaidi

services:
  frontend:
    image: node:22-alpine
    container_name: nephro-frontend-dev
    build:
      context: ./FrontEnd
      dockerfile: Dockerfile
    working_dir: /workspace/FrontEnd
    command: sh -c "npm ci && npm start -- --host 0.0.0.0 --poll 2000"
    restart: "no"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
    volumes:
      - ./FrontEnd:/workspace/FrontEnd
      - frontend_node_modules:/workspace/FrontEnd/node_modules
    ports:
      - "4300:4200"
    stdin_open: true
    tty: true
    cpus: 1
    mem_limit: 0
    depends_on: {}
    networks: []

volumes:
  frontend_node_modules:
