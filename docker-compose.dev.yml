name: nephropaidi

services:
  frontend:
    image: node:22-alpine
    container_name: nephro-frontend-dev
    build: !reset null
    working_dir: /workspace/FrontEnd
    command: sh -c "npm ci && npm start -- --host 0.0.0.0 --poll 2000"
    restart: "no"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
    volumes:
      - ./FrontEnd:/workspace/FrontEnd
      - frontend_node_modules:/workspace/FrontEnd/node_modules
    ports: !override
      - "4300:4200"
    stdin_open: true
    tty: true
    cpus: !reset null
    mem_limit: !reset null
    depends_on: !reset null
    networks: !reset null

volumes:
  frontend_node_modules:
