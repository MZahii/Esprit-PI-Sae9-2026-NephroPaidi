apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinical-service
  namespace: nephro
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clinical-service
  template:
    metadata:
      labels:
        app: clinical-service
    spec:
      containers:
        - name: clinical-service
          image: nephropaidi-clinical-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8084
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "local"
            - name: SPRING_CONFIG_IMPORT
              value: "optional:configserver:http://config-server:8888"
            - name: SPRING_CLOUD_CONFIG_URI
              value: "http://config-server:8888"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://ep-cool-breeze-agqhhjlc-pooler.c-2.eu-central-1.aws.neon.tech:5432/nephros_clinical_service.db?sslmode=require&channel_binding=require"
            - name: SPRING_DATASOURCE_USERNAME
              value: "neondb_owner"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nephro-app-secrets
                  key: CLINICAL_DB_PASSWORD
            - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
              value: "org.postgresql.Driver"
            - name: SERVER_PORT
              value: "8084"
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: "validate"
            - name: SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT
              value: "org.hibernate.dialect.PostgreSQLDialect"
            - name: SPRING_FLYWAY_ENABLED
              value: "true"
            - name: SPRING_FLYWAY_OUT_OF_ORDER
              value: "true"
            - name: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
              value: "http://eureka:8761/eureka"
            - name: EUREKA_INSTANCE_HOSTNAME
              value: "clinical-service"
            - name: KEYCLOAK_ISSUER_URI
              valueFrom:
                configMapKeyRef:
                  name: nephro-common-config
                  key: KEYCLOAK_ISSUER_URI
            - name: KEYCLOAK_JWK_SET_URI
              valueFrom:
                configMapKeyRef:
                  name: nephro-common-config
                  key: KEYCLOAK_JWK_SET_URI
            - name: SERVICES_ADMINISTRATION_BASE
              value: "http://administration-service:8087"
            - name: SERVICES_ADMINISTRATION_BASE_URL
              value: "http://administration-service:8087"
            - name: SERVICES_USER_BASE
              value: "http://user-service:8090"
            - name: SERVICES_USER_BASE_URL
              value: "http://user-service:8090"
            - name: SERVICES_PHARMACY_URL
              value: "http://pharmacy-service:8088"
            - name: SERVICES_COMMUNICATION_URL
              value: "http://communication-service:8085"
            - name: USER_SERVICE_URL
              value: "http://user-service:8090"
            - name: ADMIN_SERVICE_URL
              value: "http://administration-service:8087"
            - name: PHARMACY_SERVICE_URL
              value: "http://pharmacy-service:8088"
            - name: COMMUNICATION_SERVICE_URL
              value: "http://communication-service:8085"
            - name: SERVICES_AI_CLINICAL_BASE_URL
              value: "http://ai-clinical-service:8091"
            - name: ENVIRONMENT
              value: "docker"
            - name: LOGGING_LEVEL_ROOT
              value: "INFO"
            - name: LOGGING_LEVEL_TN_ESPRIT
              value: "DEBUG"
---
apiVersion: v1
kind: Service
metadata:
  name: clinical-service
  namespace: nephro
spec:
  selector:
    app: clinical-service
  ports:
    - name: http
      port: 8084
      targetPort: 8084

