apiVersion: apps/v1
kind: Deployment
metadata:
  name: administration-service
  namespace: nephro
spec:
  replicas: 1
  selector:
    matchLabels:
      app: administration-service
  template:
    metadata:
      labels:
        app: administration-service
    spec:
      containers:
        - name: administration-service
          image: nephropaidi-administration-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8087
          env:
            - name: SPRING_CONFIG_IMPORT
              value: "optional:configserver:http://config-server:8888"
            - name: SPRING_CLOUD_CONFIG_URI
              value: "http://config-server:8888"
            - name: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
              value: "http://eureka:8761/eureka"
            - name: EUREKA_INSTANCE_HOSTNAME
              value: "administration-service"
            - name: KEYCLOAK_ISSUER_URI
              value: "http://localhost:8080/realms/nephrospaidi"
            - name: KEYCLOAK_JWK_SET_URI
              value: "http://keycloak:8080/realms/nephrospaidi/protocol/openid-connect/certs"
            - name: USER_SERVICE_BASE_URL
              value: "http://user-service:8090"
            - name: INTERNAL_API_KEY
              value: "my-super-secret-internal-key"
            - name: ENVIRONMENT
              value: "docker"
---
apiVersion: v1
kind: Service
metadata:
  name: administration-service
  namespace: nephro
spec:
  selector:
    app: administration-service
  ports:
    - name: http
      port: 8087
      targetPort: 8087

