apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-pharmacy-service
  namespace: nephro
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-pharmacy-service
  template:
    metadata:
      labels:
        app: ai-pharmacy-service
    spec:
      containers:
        - name: ai-pharmacy-service
          image: nephropaidi-ai-pharmacy-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8093
---
apiVersion: v1
kind: Service
metadata:
  name: ai-pharmacy-service
  namespace: nephro
spec:
  selector:
    app: ai-pharmacy-service
  ports:
    - name: http
      port: 8093
      targetPort: 8093

