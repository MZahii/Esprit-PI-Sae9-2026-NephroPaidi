apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: nephro
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets:
              - localhost:9090

      - job_name: clinical-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets:
              - clinical-service:8084
