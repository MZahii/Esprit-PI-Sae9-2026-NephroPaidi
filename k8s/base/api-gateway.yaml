apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: nephro
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: nephropaidi-api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          env:
            - name: SERVER_PORT
              value: "8083"
            - name: SPRING_CONFIG_IMPORT
              value: "optional:configserver:http://config-server:8888"
            - name: SPRING_CLOUD_CONFIG_URI
              value: "http://config-server:8888"
            - name: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
              value: "http://eureka:8761/eureka"
            - name: EUREKA_INSTANCE_HOSTNAME
              value: "api-gateway"
            - name: KEYCLOAK_ISSUER_URI
              value: "http://localhost:8080/realms/nephrospaidi"
            - name: KEYCLOAK_JWK_SET_URI
              value: "http://keycloak:8080/realms/nephrospaidi/protocol/openid-connect/certs"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: nephro
spec:
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8083
      targetPort: 8083
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway
  namespace: nephro
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  ingressClassName: nginx
  rules:
    - host: nephro.local
      http:
        paths:
          - path: /(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: api-gateway
                port:
                  number: 8083

