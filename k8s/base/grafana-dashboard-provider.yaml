apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: nephro
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: nephro-dashboards
        orgId: 1
        folder: NephroPaidi
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
