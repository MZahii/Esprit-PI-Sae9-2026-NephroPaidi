apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: nephro
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: nephropaidi-user-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8090
          env:
            - name: SERVER_PORT
              value: "8090"
            - name: SPRING_CONFIG_IMPORT
              value: "optional:configserver:http://config-server:8888"
            - name: SPRING_CLOUD_CONFIG_URI
              value: "http://config-server:8888"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://ep-cool-breeze-agqhhjlc-pooler.c-2.eu-central-1.aws.neon.tech:5432/nephros_user_service_db?sslmode=require&channel_binding=require"
            - name: SPRING_DATASOURCE_USERNAME
              value: "neondb_owner"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nephro-app-secrets
                  key: USER_DB_PASSWORD
            - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
              value: "org.postgresql.Driver"
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: "validate"
            - name: SPRING_JPA_SHOW_SQL
              value: "false"
            - name: LOGGING_LEVEL_ROOT
              value: "INFO"
            - name: LOGGING_LEVEL_SPRING_WEB
              value: "DEBUG"
            - name: EUREKA_URL
              value: "http://eureka:8761/eureka"
            - name: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
              value: "http://eureka:8761/eureka"
            - name: EUREKA_INSTANCE_HOSTNAME
              value: "user-service"
            - name: KEYCLOAK_ISSUER_URI
              valueFrom:
                configMapKeyRef:
                  name: nephro-common-config
                  key: KEYCLOAK_ISSUER_URI
            - name: KEYCLOAK_JWK_SET_URI
              valueFrom:
                configMapKeyRef:
                  name: nephro-common-config
                  key: KEYCLOAK_JWK_SET_URI
            - name: KEYCLOAK_SERVER_URL
              valueFrom:
                configMapKeyRef:
                  name: nephro-common-config
                  key: KEYCLOAK_SERVER_URL
            - name: KEYCLOAK_REALM
              valueFrom:
                configMapKeyRef:
                  name: nephro-common-config
                  key: KEYCLOAK_REALM
            - name: KEYCLOAK_ADMIN_CLIENT_ID
              value: "admin-cli"
            - name: KEYCLOAK_ADMIN_USERNAME
              value: "admin"
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nephro-app-secrets
                  key: KEYCLOAK_ADMIN_PASSWORD
            - name: KEYCLOAK_AUTH_CLIENT_ID
              value: "nephro-backend"
            - name: KEYCLOAK_AUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: nephro-app-secrets
                  key: KEYCLOAK_AUTH_CLIENT_SECRET
            - name: KEYCLOAK_VERIFICATION_ENABLED
              value: "true"
            - name: ADMINISTRATION_SERVICE_BASE_URL
              value: "http://administration-service:8087"
            - name: ENVIRONMENT
              value: "docker"
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: nephro
spec:
  selector:
    app: user-service
  ports:
    - name: http
      port: 8090
      targetPort: 8090

